# Log analysis pipeline compose file.
#
# Backend selection via GPU_BACKEND env var (default=rocm):
#   GPU_BACKEND=rocm docker compose build
#   GPU_BACKEND=cuda docker compose build
#   GPU_BACKEND=cpu  docker compose build
#
# GPU device passthrough via override files:
#   GPU_BACKEND=rocm docker compose -f docker-compose.yml -f docker-compose.rocm.yml up
#   GPU_BACKEND=cuda docker compose -f docker-compose.yml -f docker-compose.cuda.yml up
#   docker compose up     # CPU mode, no GPU
#
# Run (HuggingFace backend, standalone):
#   docker compose up log-analysis
#   docker compose run --rm log-analysis \
#     --backend huggingface --model-name microsoft/Phi-3-mini-4k-instruct

services:
  # ollama:
  #   image: ollama/ollama:latest
  #   ports:
  #     - "${OLLAMA_HOST_PORT:-11434}:11434"
  #   volumes:
  #     - ollama-models:/root/.ollama
  #   post_start:
  #     - command: ollama pull hf.co/mradermacher/llama-3.2-1B-log-analyzer-GGUF:Q4_K_M
  #     - command: ollama run hf.co/mradermacher/llama-3.2-1B-log-analyzer-GGUF:Q4_K_M
  #   healthcheck:
  #     test: ["CMD", "ollama", "list"]
  #     interval: 10s
  #     retries: 5
  ollama:
    image: ollama/ollama:rocm
    ports:
      - "${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollama-models:/root/.ollama
    devices:
      - /dev/kfd
      - /dev/dri
    post_start:
      - command: ollama pull hf.co/mradermacher/llama-3.2-1B-log-analyzer-GGUF:Q4_K_M
      - command: ollama run hf.co/mradermacher/llama-3.2-1B-log-analyzer-GGUF:Q4_K_M
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      retries: 5
  
  grafana:
    image: grafana/grafana-enterprise
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana

  log-analysis:
    build:
      context: .
      args:
        GPU_BACKEND: ${GPU_BACKEND:-rocm}
    image: log-analysis:${GPU_BACKEND:-rocm}
    volumes:
      - ./logs:/app/logs:ro
      - ./analysis:/app/analysis
      - hf-models:/root/.cache/huggingface
    env_file:
      - .env
    environment:
      - OLLAMA_HOST=ollama
      - OLLAMA_PORT=11434
    depends_on:
      ollama:
        condition: service_healthy
    command: >
      --mode embedding
      --backend ollama
      --model-name hf.co/mradermacher/llama-3.2-1B-log-analyzer-GGUF:Q4_K_M
      --embedding-model-name sentence-transformers/all-MiniLM-L6-v2
      --ollama-host ollama
      --ollama-port 11434
      --hf-device cuda

volumes:
  ollama-models:
  hf-models:
  grafana-data:
